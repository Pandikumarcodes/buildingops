[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "buildingops-simulator"
version = "0.1.0"
description = "Local synthetic telemetry simulator for BuildingOps"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.18,<2", "pytest>=8,<9", "ruff>=0.13,<1"]

[project.scripts]
buildingops-simulator = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
